[tools]
go = "1.26.3"
# Latest Node LTS for stability.
node = "24.18.0"
air = "latest"
"go:gotest.tools/gotestsum" = "latest"
"go:github.com/swaggo/swag/cmd/swag" = "1.16.6"

[tasks.install]
description = "Installs frontend dependencies"
run = "npm --prefix web install"

[tasks.dev]
description = "Runs the project with live reload"
depends = ["gen:embed"]
env = { WADE_ADDR = "editor-dev.localhost:8090" }
run = "air"

[tasks.build]
description = "Builds the wade binary"
depends = ["gen:embed"]
run = "go build -o .tmp/wade ./cmd/wade"

[tasks."build:install"]
description = "Builds embedded assets and installs the wade binary"
depends = ["gen:embed"]
run = "go install ./cmd/wade"

[tasks.fmt]
description = "Formats Go code"
run = "go fmt ./..."

[tasks."gen:embed"]
description = "Stages embedded web assets"
depends = ["install", "gen:openapi"]
run = "go generate ./..."

[tasks."gen:openapi"]
description = "Generates the OpenAPI spec"
run = "swag init --quiet --generalInfo cmd/wade/main.go --dir . --parseInternal --output internal/server/openapi --outputTypes json,yaml"

[tasks."lint:openapi"]
description = "Checks generated OpenAPI spec"
run = """
tmp_dir=$(mktemp -d)
trap 'rm -rf "$tmp_dir"' EXIT
swag init --quiet --generalInfo cmd/wade/main.go --dir . --parseInternal --output "$tmp_dir" --outputTypes json,yaml
diff -u internal/server/openapi/swagger.json "$tmp_dir/swagger.json"
diff -u internal/server/openapi/swagger.yaml "$tmp_dir/swagger.yaml"
"""

[tasks."lint:fmt"]
description = "Checks Go formatting"
run = "test -z $(gofmt -l .)"

[tasks."lint:vet"]
description = "Runs go vet"
depends = ["gen:embed"]
run = "go vet ./..."

[tasks.test]
description = "Runs tests"
depends = ["gen:embed"]
run = "gotestsum -- ./..."
