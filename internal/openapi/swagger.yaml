basePath: /
consumes:
- application/json
definitions:
  Agent:
    properties:
      command:
        type: string
      default:
        type: boolean
      name:
        type: string
    required:
    - command
    - default
    - name
    type: object
  Branch:
    properties:
      checkedOutWorkspaceId:
        type: string
        x-nullable: true
      hasLocalBranch:
        type: boolean
      name:
        type: string
      ref:
        type: string
      remote:
        type: string
        x-nullable: true
    required:
    - checkedOutWorkspaceId
    - hasLocalBranch
    - name
    - ref
    - remote
    type: object
  BranchList:
    properties:
      items:
        items:
          $ref: '#/definitions/Branch'
        type: array
    required:
    - items
    type: object
  CreateWorktreeRequest:
    properties:
      branchRef:
        type: string
    required:
    - branchRef
    type: object
  IssueReference:
    properties:
      key:
        type: string
      provider:
        type: string
      url:
        type: string
    required:
    - key
    - provider
    - url
    type: object
  MaterialiseWorkspaceRequest:
    properties:
      remoteRepositoryId:
        type: string
      workspaceDirectory:
        type: string
    required:
    - remoteRepositoryId
    - workspaceDirectory
    type: object
  Problem:
    properties:
      code:
        type: string
      detail:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    required:
    - code
    - detail
    - status
    - title
    - type
    type: object
  RemoteRepository:
    properties:
      cloneUrl:
        type: string
      id:
        type: string
      localWorkspaceIds:
        items:
          type: string
        type: array
      name:
        type: string
      webUrl:
        type: string
    required:
    - cloneUrl
    - id
    - localWorkspaceIds
    - name
    - webUrl
    type: object
  RemoteRepositoryList:
    properties:
      items:
        items:
          $ref: '#/definitions/RemoteRepository'
        type: array
    required:
    - items
    type: object
  Repository:
    properties:
      id:
        type: string
      mainWorkspaceId:
        type: string
      remoteRepositoryId:
        type: string
        x-nullable: true
      workspaceIds:
        items:
          type: string
        type: array
    required:
    - id
    - mainWorkspaceId
    - remoteRepositoryId
    - workspaceIds
    type: object
  ReviewChangeStatus:
    enum:
    - modified
    - added
    - deleted
    - renamed
    type: string
    x-enum-varnames:
    - StatusModified
    - StatusAdded
    - StatusDeleted
    - StatusRenamed
  ReviewFile:
    properties:
      gitDiff:
        allOf:
        - $ref: '#/definitions/ReviewFileComparison'
        x-nullable: true
      hasWorkingTreeFile:
        type: boolean
      id:
        type: string
      inGitDiff:
        type: boolean
      inLastCommit:
        type: boolean
      inPullRequest:
        type: boolean
      lastCommit:
        allOf:
        - $ref: '#/definitions/ReviewFileComparison'
        x-nullable: true
      path:
        type: string
      pullRequest:
        allOf:
        - $ref: '#/definitions/ReviewFileComparison'
        x-nullable: true
      worktreeStatus:
        allOf:
        - $ref: '#/definitions/ReviewChangeStatus'
        x-nullable: true
    required:
    - gitDiff
    - hasWorkingTreeFile
    - id
    - inGitDiff
    - inLastCommit
    - inPullRequest
    - lastCommit
    - path
    - pullRequest
    - worktreeStatus
    type: object
  ReviewFileComparison:
    properties:
      displayPath:
        type: string
      hasModified:
        type: boolean
      hasOriginal:
        type: boolean
      newPath:
        type: string
        x-nullable: true
      oldPath:
        type: string
        x-nullable: true
      status:
        $ref: '#/definitions/ReviewChangeStatus'
    required:
    - displayPath
    - hasModified
    - hasOriginal
    - newPath
    - oldPath
    - status
    type: object
  ReviewFileContents:
    properties:
      modifiedContent:
        type: string
      originalContent:
        type: string
    required:
    - modifiedContent
    - originalContent
    type: object
  ReviewSnapshot:
    properties:
      branch:
        allOf:
        - $ref: '#/definitions/ReviewSnapshotBranch'
        x-nullable: true
      createdAt:
        type: string
      files:
        items:
          $ref: '#/definitions/ReviewFile'
        type: array
      id:
        type: string
      pullRequest:
        allOf:
        - $ref: '#/definitions/ReviewSnapshotPullRequest'
        x-nullable: true
      workspaceId:
        type: string
    required:
    - branch
    - createdAt
    - files
    - id
    - pullRequest
    - workspaceId
    type: object
  ReviewSnapshotBranch:
    properties:
      name:
        type: string
      ref:
        type: string
      remote:
        type: string
        x-nullable: true
    required:
    - name
    - ref
    - remote
    type: object
  ReviewSnapshotPullRequest:
    properties:
      baseRef:
        type: string
      headRef:
        type: string
      number:
        type: integer
      url:
        type: string
    required:
    - baseRef
    - headRef
    - number
    - url
    type: object
  Settings:
    properties:
      agents:
        items:
          $ref: '#/definitions/Agent'
        type: array
      copyIgnoredFilesOnWorktreeCreation:
        type: boolean
      openWorktreesInNewTabs:
        type: boolean
      shell:
        type: string
      themeAccentColor:
        enum:
        - white
        - orange
        - purple
        type: string
      workspaceDirectories:
        items:
          type: string
        type: array
      worktreeCopyExcludes:
        items:
          type: string
        type: array
    required:
    - agents
    - copyIgnoredFilesOnWorktreeCreation
    - openWorktreesInNewTabs
    - shell
    - themeAccentColor
    - workspaceDirectories
    - worktreeCopyExcludes
    type: object
  Terminal:
    properties:
      agent:
        type: string
        x-nullable: true
      id:
        type: string
      role:
        $ref: '#/definitions/TerminalRole'
      socketUrl:
        type: string
      status:
        $ref: '#/definitions/TerminalStatus'
      workspaceId:
        type: string
    required:
    - agent
    - id
    - role
    - socketUrl
    - status
    - workspaceId
    type: object
  TerminalInputMode:
    enum:
    - raw
    - bracketed-paste
    type: string
    x-enum-varnames:
    - InputModeRaw
    - InputModeBracketedPaste
  TerminalInputRequest:
    properties:
      mode:
        $ref: '#/definitions/TerminalInputMode'
      text:
        type: string
    required:
    - mode
    - text
    type: object
  TerminalList:
    properties:
      items:
        items:
          $ref: '#/definitions/Terminal'
        type: array
    required:
    - items
    type: object
  TerminalRole:
    enum:
    - agent
    - misc
    - server
    - scratchpad
    type: string
    x-enum-varnames:
    - TerminalRoleAgent
    - TerminalRoleMisc
    - TerminalRoleServer
    - TerminalRoleScratchpad
  TerminalStatus:
    enum:
    - running
    type: string
    x-enum-varnames:
    - TerminalStatusRunning
  Workspace:
    properties:
      activity:
        $ref: '#/definitions/WorkspaceActivity'
      branch:
        allOf:
        - $ref: '#/definitions/WorkspaceBranch'
        x-nullable: true
      id:
        type: string
      links:
        $ref: '#/definitions/WorkspaceLinks'
      name:
        type: string
      remoteRepositoryId:
        type: string
        x-nullable: true
      repositoryId:
        type: string
        x-nullable: true
      worktree:
        allOf:
        - $ref: '#/definitions/WorktreeReference'
        x-nullable: true
    required:
    - activity
    - branch
    - id
    - links
    - name
    - remoteRepositoryId
    - repositoryId
    - worktree
    type: object
  WorkspaceActivity:
    properties:
      activeTerminalCount:
        type: integer
    required:
    - activeTerminalCount
    type: object
  WorkspaceBranch:
    properties:
      commit:
        type: string
      isDetached:
        type: boolean
      name:
        type: string
      ref:
        type: string
    required:
    - commit
    - isDetached
    - name
    - ref
    type: object
  WorkspaceLinks:
    properties:
      issue:
        allOf:
        - $ref: '#/definitions/IssueReference'
        x-nullable: true
      pullRequest:
        type: string
        x-nullable: true
      repository:
        type: string
        x-nullable: true
    required:
    - issue
    - pullRequest
    - repository
    type: object
  WorkspaceList:
    properties:
      items:
        items:
          $ref: '#/definitions/WorkspaceSummary'
        type: array
    required:
    - items
    type: object
  WorkspaceSummary:
    properties:
      activity:
        $ref: '#/definitions/WorkspaceActivity'
      branch:
        allOf:
        - $ref: '#/definitions/WorkspaceBranch'
        x-nullable: true
      id:
        type: string
      links:
        $ref: '#/definitions/WorkspaceLinks'
      name:
        type: string
      remoteRepositoryId:
        type: string
        x-nullable: true
      repositoryId:
        type: string
        x-nullable: true
      worktree:
        allOf:
        - $ref: '#/definitions/WorktreeReference'
        x-nullable: true
    required:
    - activity
    - branch
    - id
    - links
    - name
    - remoteRepositoryId
    - repositoryId
    - worktree
    type: object
  Worktree:
    properties:
      branch:
        allOf:
        - $ref: '#/definitions/Branch'
        x-nullable: true
      id:
        type: string
      ignoredFileCopyWarnings:
        items:
          type: string
        type: array
      isMain:
        type: boolean
      isRemovable:
        type: boolean
      name:
        type: string
      repositoryId:
        type: string
      workspaceId:
        type: string
    required:
    - branch
    - id
    - isMain
    - isRemovable
    - name
    - repositoryId
    - workspaceId
    type: object
  WorktreeList:
    properties:
      items:
        items:
          $ref: '#/definitions/Worktree'
        type: array
    required:
    - items
    type: object
  WorktreeReference:
    properties:
      id:
        type: string
      isMain:
        type: boolean
      isRemovable:
        type: boolean
    required:
    - id
    - isMain
    - isRemovable
    type: object
info:
  contact: {}
  description: Local HTTP API for the WADE browser workspace.
  title: WADE API
  version: 0.1.0
paths:
  /api/openapi.json:
    get:
      operationId: getOpenAPISpec
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Get OpenAPI spec
      tags:
      - OpenAPI
      x-wade-cli-ignore: true
  /api/v1/remote-repositories:
    get:
      operationId: listRemoteRepositories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/RemoteRepositoryList'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: List remote repositories
      tags:
      - Remote repositories
  /api/v1/repositories/{repositoryId}:
    get:
      operationId: getRepository
      parameters:
      - description: Repository ID
        in: path
        name: repositoryId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Repository'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Get a local repository
      tags:
      - Repositories
  /api/v1/repositories/{repositoryId}/branches:
    get:
      operationId: listRepositoryBranches
      parameters:
      - description: Repository ID
        in: path
        name: repositoryId
        required: true
        type: string
      - description: Branch kind
        enum:
        - local
        - remote
        in: query
        name: kind
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BranchList'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: List repository branches
      tags:
      - Branches
  /api/v1/repositories/{repositoryId}/worktrees:
    get:
      operationId: listRepositoryWorktrees
      parameters:
      - description: Repository ID
        in: path
        name: repositoryId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/WorktreeList'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: List repository worktrees
      tags:
      - Worktrees
    post:
      consumes:
      - application/json
      operationId: createRepositoryWorktree
      parameters:
      - description: Repository ID
        in: path
        name: repositoryId
        required: true
        type: string
      - description: Worktree creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateWorktreeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Created worktree URL
              type: string
          schema:
            $ref: '#/definitions/Worktree'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Create a repository worktree
      tags:
      - Worktrees
  /api/v1/repositories/{repositoryId}/worktrees/{worktreeId}:
    delete:
      operationId: deleteRepositoryWorktree
      parameters:
      - description: Repository ID
        in: path
        name: repositoryId
        required: true
        type: string
      - description: Worktree ID
        in: path
        name: worktreeId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Remove a repository worktree
      tags:
      - Worktrees
  /api/v1/review-snapshots/{snapshotId}:
    delete:
      operationId: deleteReviewSnapshot
      parameters:
      - description: Review snapshot ID
        in: path
        name: snapshotId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Delete a review snapshot
      tags:
      - Review snapshots
    get:
      operationId: getReviewSnapshot
      parameters:
      - description: Review snapshot ID
        in: path
        name: snapshotId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ReviewSnapshot'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Get a review snapshot
      tags:
      - Review snapshots
  /api/v1/review-snapshots/{snapshotId}/files/{fileId}/contents:
    get:
      operationId: getReviewSnapshotFileContents
      parameters:
      - description: Review snapshot ID
        in: path
        name: snapshotId
        required: true
        type: string
      - description: Snapshot file ID
        in: path
        name: fileId
        required: true
        type: string
      - description: Comparison scope
        enum:
        - pull-request
        - working-tree
        - last-commit
        - current
        in: query
        name: scope
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ReviewFileContents'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Get review snapshot file contents
      tags:
      - Review snapshots
  /api/v1/settings:
    get:
      operationId: getSettings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Settings'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Get settings
      tags:
      - Settings
    put:
      consumes:
      - application/json
      operationId: updateSettings
      parameters:
      - description: Complete settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Settings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Settings'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Update settings
      tags:
      - Settings
  /api/v1/settings/reload:
    post:
      operationId: reloadSettings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Settings'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Reload settings from disk
      tags:
      - Settings
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      parameters:
      - description: Filter by activity
        enum:
        - active
        in: query
        name: activity
        type: string
      - description: Local repository ID
        in: query
        name: repositoryId
        type: string
      - description: Remote repository ID
        in: query
        name: remoteRepositoryId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/WorkspaceList'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: List workspaces
      tags:
      - Workspaces
    post:
      consumes:
      - application/json
      operationId: materialiseWorkspace
      parameters:
      - description: Workspace materialisation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/MaterialiseWorkspaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Created workspace URL
              type: string
          schema:
            $ref: '#/definitions/Workspace'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Materialise a remote repository as a workspace
      tags:
      - Workspaces
  /api/v1/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      parameters:
      - description: Workspace ID
        in: path
        name: workspaceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Workspace'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Get a workspace
      tags:
      - Workspaces
  /api/v1/workspaces/{workspaceId}/review-snapshots:
    post:
      operationId: createReviewSnapshot
      parameters:
      - description: Workspace ID
        in: path
        name: workspaceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Created review snapshot URL
              type: string
          schema:
            $ref: '#/definitions/ReviewSnapshot'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Create a review snapshot
      tags:
      - Review snapshots
  /api/v1/workspaces/{workspaceId}/terminals:
    delete:
      operationId: deleteWorkspaceTerminals
      parameters:
      - description: Workspace ID
        in: path
        name: workspaceId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Close all workspace terminals
      tags:
      - Terminals
    get:
      operationId: listWorkspaceTerminals
      parameters:
      - description: Workspace ID
        in: path
        name: workspaceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TerminalList'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: List workspace terminals
      tags:
      - Terminals
  /api/v1/workspaces/{workspaceId}/terminals/{terminalId}:
    delete:
