basePath: /
consumes:
- application/json
definitions:
  Agent:
    properties:
      command:
        type: string
      default:
        type: boolean
      name:
        type: string
    required:
    - command
    - default
    - name
    type: object
  Branch:
    properties:
      checkedOutWorkspaceId:
        type: string
        x-nullable: true
      hasLocalBranch:
        type: boolean
      name:
        type: string
      ref:
        type: string
      remote:
        type: string
        x-nullable: true
    required:
    - checkedOutWorkspaceId
    - hasLocalBranch
    - name
    - ref
    - remote
    type: object
  BranchList:
    properties:
      items:
        items:
          $ref: '#/definitions/Branch'
        type: array
    required:
    - items
    type: object
  CreateReviewAnnotationRequest:
    properties:
      author:
        type: string
        x-nullable: true
      endLine:
        minimum: 1
        type: integer
      fileId:
        type: string
      rationale:
        type: string
        x-nullable: true
      scope:
        allOf:
        - $ref: '#/definitions/reviewsnapshots.Scope'
        enum:
        - working-tree
        - last-commit
        - pull-request
      side:
        allOf:
        - $ref: '#/definitions/ReviewAnnotationSide'
        enum:
        - original
        - modified
      startLine:
        minimum: 1
        type: integer
      summary:
        type: string
    required:
    - endLine
    - fileId
    - scope
    - side
    - startLine
    - summary
    type: object
  CreateWorktreeRequest:
    properties:
      branchRef:
        type: string
    required:
    - branchRef
    type: object
  IssueReference:
    properties:
      key:
        type: string
      provider:
        type: string
      url:
        type: string
    required:
    - key
    - provider
    - url
    type: object
  LinearSettings:
    properties:
      enabled:
        type: boolean
      workspace:
        type: string
    required:
    - enabled
    - workspace
    type: object
  MaterialiseWorkspaceRequest:
    properties:
      remoteRepositoryId:
        type: string
      workspaceDirectory:
        type: string
    required:
    - remoteRepositoryId
    - workspaceDirectory
    type: object
  Problem:
    properties:
      code:
        type: string
      detail:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    required:
    - code
    - detail
    - status
    - title
    - type
    type: object
  RemoteRepository:
    properties:
      cloneUrl:
        type: string
      id:
        type: string
      localWorkspaceIds:
        items:
          type: string
        type: array
      name:
        type: string
      webUrl:
        type: string
    required:
    - cloneUrl
    - id
    - localWorkspaceIds
    - name
    - webUrl
    type: object
  RemoteRepositoryList:
    properties:
      items:
        items:
          $ref: '#/definitions/RemoteRepository'
        type: array
    required:
    - items
    type: object
  Repository:
    properties:
      id:
        type: string
      mainWorkspaceId:
        type: string
      remoteRepositoryId:
        type: string
        x-nullable: true
      workspaceIds:
        items:
          type: string
        type: array
    required:
    - id
    - mainWorkspaceId
    - remoteRepositoryId
    - workspaceIds
    type: object
  ReviewAnnotation:
    properties:
      author:
        type: string
        x-nullable: true
      createdAt:
        type: string
      endLine:
        type: integer
      fileId:
        type: string
      id:
        type: string
      rationale:
        type: string
        x-nullable: true
      scope:
        allOf:
        - $ref: '#/definitions/reviewsnapshots.Scope'
        enum:
        - working-tree
        - last-commit
        - pull-request
      side:
        allOf:
        - $ref: '#/definitions/ReviewAnnotationSide'
        enum:
        - original
        - modified
      snapshotId:
        type: string
      startLine:
        type: integer
      summary:
        type: string
    required:
    - author
    - createdAt
    - endLine
    - fileId
    - id
    - rationale
    - scope
    - side
    - snapshotId
    - startLine
    - summary
    type: object
  ReviewAnnotationList:
    properties:
      items:
        items:
          $ref: '#/definitions/ReviewAnnotation'
        type: array
    required:
    - items
    type: object
  ReviewAnnotationSide:
    enum:
    - original
    - modified
    type: string
    x-enum-varnames:
    - AnnotationSideOriginal
    - AnnotationSideModified
  ReviewChangeStatus:
    enum:
    - modified
    - added
    - deleted
    - renamed
    type: string
    x-enum-varnames:
    - StatusModified
    - StatusAdded
    - StatusDeleted
    - StatusRenamed
  ReviewFile:
    properties:
      gitDiff:
        allOf:
        - $ref: '#/definitions/ReviewFileComparison'
        x-nullable: true
      hasWorkingTreeFile:
        type: boolean
      id:
        type: string
      inGitDiff:
        type: boolean
      inLastCommit:
        type: boolean
      inPullRequest:
        type: boolean
      lastCommit:
        allOf:
        - $ref: '#/definitions/ReviewFileComparison'
        x-nullable: true
      path:
        type: string
      pullRequest:
        allOf:
        - $ref: '#/definitions/ReviewFileComparison'
        x-nullable: true
      worktreeStatus:
        allOf:
        - $ref: '#/definitions/ReviewChangeStatus'
        x-nullable: true
    required:
    - gitDiff
    - hasWorkingTreeFile
    - id
    - inGitDiff
    - inLastCommit
    - inPullRequest
    - lastCommit
    - path
    - pullRequest
    - worktreeStatus
    type: object
  ReviewFileComparison:
    properties:
      displayPath:
        type: string
      hasModified:
        type: boolean
      hasOriginal:
        type: boolean
      newPath:
        type: string
        x-nullable: true
      oldPath:
        type: string
        x-nullable: true
      status:
        $ref: '#/definitions/ReviewChangeStatus'
    required:
    - displayPath
    - hasModified
    - hasOriginal
    - newPath
    - oldPath
    - status
    type: object
  ReviewFileContents:
    properties:
      modifiedContent:
        type: string
      originalContent:
        type: string
    required:
    - modifiedContent
    - originalContent
    type: object
  ReviewSnapshot:
    properties:
      branch:
        allOf:
        - $ref: '#/definitions/ReviewSnapshotBranch'
        x-nullable: true
      createdAt:
        type: string
      files:
        items:
          $ref: '#/definitions/ReviewFile'
        type: array
      id:
        type: string
      pullRequest:
        allOf:
        - $ref: '#/definitions/ReviewSnapshotPullRequest'
        x-nullable: true
      workspaceId:
        type: string
    required:
    - branch
    - createdAt
    - files
    - id
    - pullRequest
    - workspaceId
    type: object
  ReviewSnapshotBranch:
    properties:
      name:
        type: string
      ref:
        type: string
      remote:
        type: string
        x-nullable: true
    required:
    - name
    - ref
    - remote
    type: object
  ReviewSnapshotList:
    properties:
      items:
        items:
          $ref: '#/definitions/ReviewSnapshot'
        type: array
    required:
    - items
    type: object
  ReviewSnapshotPullRequest:
    properties:
      baseRef:
        type: string
      headRef:
        type: string
      number:
        type: integer
      url:
        type: string
    required:
    - baseRef
    - headRef
    - number
    - url
    type: object
  Settings:
    properties:
      agents:
        items:
          $ref: '#/definitions/Agent'
        type: array
      copyIgnoredFilesOnWorktreeCreation:
        type: boolean
      linear:
        $ref: '#/definitions/LinearSettings'
      openWorktreesInNewTabs:
        type: boolean
      shell:
        type: string
      themeAccentColor:
        enum:
        - white
        - orange
        - purple
        type: string
      workspaceDirectories:
        items:
          type: string
        type: array
      worktreeCopyExcludes:
        items:
          type: string
        type: array
    required:
    - agents
    - copyIgnoredFilesOnWorktreeCreation
    - linear
    - openWorktreesInNewTabs
    - shell
    - themeAccentColor
    - workspaceDirectories
    - worktreeCopyExcludes
    type: object
  Terminal:
    properties:
      agent:
        type: string
        x-nullable: true
      id:
        type: string
      role:
        $ref: '#/definitions/TerminalRole'
      socketUrl:
        type: string
      status:
        $ref: '#/definitions/TerminalStatus'
      workspaceId:
        type: string
    required:
    - agent
    - id
    - role
    - socketUrl
    - status
    - workspaceId
    type: object
  TerminalInputMode:
    enum:
    - raw
    - bracketed-paste
    type: string
    x-enum-varnames:
    - InputModeRaw
    - InputModeBracketedPaste
  TerminalInputRequest:
    properties:
      mode:
        $ref: '#/definitions/TerminalInputMode'
      text:
        type: string
    required:
    - mode
    - text
    type: object
  TerminalList:
    properties:
      items:
        items:
          $ref: '#/definitions/Terminal'
        type: array
    required:
    - items
    type: object
  TerminalRole:
    enum:
    - agent
    - misc
    - server
    - scratchpad
    type: string
    x-enum-varnames:
    - TerminalRoleAgent
    - TerminalRoleMisc
    - TerminalRoleServer
    - TerminalRoleScratchpad
  TerminalStatus:
    enum:
    - running
    type: string
    x-enum-varnames:
    - TerminalStatusRunning
  Workspace:
    properties:
      activity:
        $ref: '#/definitions/WorkspaceActivity'
      branch:
        allOf:
        - $ref: '#/definitions/WorkspaceBranch'
        x-nullable: true
      id:
        type: string
      links:
        $ref: '#/definitions/WorkspaceLinks'
      name:
        type: string
      remoteRepositoryId:
        type: string
        x-nullable: true
      repositoryId:
        type: string
        x-nullable: true
      worktree:
        allOf:
        - $ref: '#/definitions/WorktreeReference'
        x-nullable: true
    required:
    - activity
    - branch
    - id
    - links
    - name
    - remoteRepositoryId
    - repositoryId
    - worktree
    type: object
  WorkspaceActivity:
    properties:
      activeTerminalCount:
        type: integer
    required:
    - activeTerminalCount
    type: object
  WorkspaceBranch:
    properties:
      commit:
        type: string
      isDetached:
        type: boolean
      name:
        type: string
      ref:
        type: string
    required:
    - commit
    - isDetached
    - name
    - ref
    type: object
  WorkspaceLinks:
    properties:
      issue:
        allOf:
        - $ref: '#/definitions/IssueReference'
        x-nullable: true
      pullRequest:
        type: string
        x-nullable: true
      repository:
        type: string
        x-nullable: true
    required:
    - issue
    - pullRequest
    - repository
    type: object
  WorkspaceList:
    properties:
      items:
        items:
          $ref: '#/definitions/WorkspaceSummary'
        type: array
    required:
    - items
    type: object
  WorkspaceSummary:
    properties:
      activity:
        $ref: '#/definitions/WorkspaceActivity'
      branch:
        allOf:
        - $ref: '#/definitions/WorkspaceBranch'
        x-nullable: true
      id:
        type: string
      links:
        $ref: '#/definitions/WorkspaceLinks'
      name:
        type: string
      remoteRepositoryId:
        type: string
        x-nullable: true
      repositoryId:
        type: string
        x-nullable: true
      worktree:
        allOf:
        - $ref: '#/definitions/WorktreeReference'
        x-nullable: true
    required:
    - activity
    - branch
    - id
    - links
    - name
    - remoteRepositoryId
    - repositoryId
    - worktree
    type: object
  Worktree:
    properties:
      branch:
        allOf:
        - $ref: '#/definitions/Branch'
        x-nullable: true
      id:
        type: string
      ignoredFileCopyWarnings:
        items:
          type: string
        type: array
      isMain:
        type: boolean
      isRemovable:
        type: boolean
      name:
        type: string
      repositoryId:
        type: string
      workspaceId:
        type: string
    required:
    - branch
    - id
    - isMain
    - isRemovable
    - name
    - repositoryId
    - workspaceId
    type: object
  WorktreeList:
    properties:
      items:
        items:
          $ref: '#/definitions/Worktree'
        type: array
    required:
    - items
    type: object
  WorktreeReference:
    properties:
      id:
        type: string
      isMain:
        type: boolean
      isRemovable:
        type: boolean
    required:
    - id
    - isMain
    - isRemovable
    type: object
  reviewsnapshots.Scope:
    enum:
    - pull-request
    - working-tree
    - last-commit
    - current
    type: string
    x-enum-varnames:
    - ScopePullRequest
    - ScopeWorkingTree
    - ScopeLastCommit
    - ScopeCurrent
info:
  contact: {}
  description: Local HTTP API for the WADE browser workspace.
  title: WADE API
  version: 0.1.0
paths:
  /api/openapi.json:
    get:
      operationId: getOpenAPISpec
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Get OpenAPI spec
      tags:
      - OpenAPI
      x-wade-cli-ignore: true
  /api/v1/remote-repositories:
    get:
      operationId: listRemoteRepositories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/RemoteRepositoryList'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: List remote repositories
      tags:
      - Remote repositories
  /api/v1/repositories/{repositoryId}:
    get:
      operationId: getRepository
      parameters:
      - description: Repository ID
        in: path
        name: repositoryId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Repository'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Get a local repository
      tags:
      - Repositories
  /api/v1/repositories/{repositoryId}/branches:
    get:
      operationId: listRepositoryBranches
      parameters:
      - description: Repository ID
        in: path
        name: repositoryId
        required: true
        type: string
      - description: Branch kind
        enum:
        - local
        - remote
        in: query
        name: kind
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BranchList'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: List repository branches
      tags:
      - Branches
  /api/v1/repositories/{repositoryId}/worktrees:
    get:
      operationId: listRepositoryWorktrees
      parameters:
      - description: Repository ID
        in: path
        name: repositoryId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/WorktreeList'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: List repository worktrees
      tags:
      - Worktrees
    post:
      consumes:
      - application/json
      operationId: createRepositoryWorktree
      parameters:
      - description: Repository ID
        in: path
        name: repositoryId
        required: true
        type: string
      - description: Worktree creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateWorktreeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Created worktree URL
              type: string
          schema:
            $ref: '#/definitions/Worktree'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Create a repository worktree
      tags:
      - Worktrees
  /api/v1/repositories/{repositoryId}/worktrees/{worktreeId}:
    delete:
      operationId: deleteRepositoryWorktree
      parameters:
      - description: Repository ID
        in: path
        name: repositoryId
        required: true
        type: string
      - description: Worktree ID
        in: path
        name: worktreeId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Remove a repository worktree
      tags:
      - Worktrees
  /api/v1/review-snapshots/{snapshotId}:
    delete:
      operationId: deleteReviewSnapshot
      parameters:
      - description: Review snapshot ID
        in: path
        name: snapshotId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Delete a review snapshot
      tags:
      - Review snapshots
    get:
      operationId: getReviewSnapshot
      parameters:
      - description: Review snapshot ID
        in: path
        name: snapshotId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ReviewSnapshot'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Get a review snapshot
      tags:
      - Review snapshots
  /api/v1/review-snapshots/{snapshotId}/annotations:
    get:
      description: Returns annotations in creation order for the explicit review snapshot
        ID. Use list-workspace-review-snapshots to discover snapshots.
      operationId: listReviewAnnotations
      parameters:
      - description: Explicit review snapshot ID discovered with list-workspace-review-snapshots
        in: path
        name: snapshotId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ReviewAnnotationList'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: List review annotations
      tags:
      - Review annotations
    post:
      consumes:
      - application/json
      description: Create an agent note against exact captured comparison content.
        First run wade api list-workspace-review-snapshots --workspace-id <workspace-id>
        and select an explicit snapshot ID. Line numbers are one-based and startLine
        and endLine form an inclusive range. Revision is delete followed by create;
        there is no update operation.
      operationId: createReviewAnnotation
      parameters:
      - description: Explicit review snapshot ID discovered with list-workspace-review-snapshots
        in: path
        name: snapshotId
        required: true
        type: string
      - description: 'First discover snapshots with wade api list-workspace-review-snapshots
          --workspace-id <workspace-id>. JSON fields: fileId, scope, side, startLine,
          endLine, and summary are required; rationale and author are optional. scope
          is working-tree, last-commit, or pull-request. side is original or modified.
          Lines are one-based and inclusive. Complete invocation example: wade api
          create-review-annotation --snapshot-id <snapshot-id> --body @annotation.json'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateReviewAnnotationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Created annotation URL used for deletion
              type: string
          schema:
            $ref: '#/definitions/ReviewAnnotation'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Create an immutable review annotation
      tags:
      - Review annotations
  /api/v1/review-snapshots/{snapshotId}/annotations/{annotationId}:
    delete:
      description: Deletes the annotation identified by annotationId beneath the explicit
        snapshotId. List annotations first if the annotation ID is not known. To revise
        a note, delete it and create a replacement.
      operationId: deleteReviewAnnotation
      parameters:
      - description: Review snapshot ID
        in: path
        name: snapshotId
        required: true
        type: string
      - description: Opaque annotation ID returned by create-review-annotation or
          list-review-annotations
        in: path
        name: annotationId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Delete a review annotation
      tags:
      - Review annotations
  /api/v1/review-snapshots/{snapshotId}/annotations/events:
    get:
      description: Browser synchronisation transport. Each annotations-changed event
        contains the current collection revision; reload the annotation collection
        after every new revision.
      operationId: subscribeReviewAnnotationEvents
      parameters:
      - description: Review snapshot ID
        in: path
        name: snapshotId
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: Server-sent annotations-changed events
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Problem'
      summary: Subscribe to review annotation changes
      tags:
      - Review annotations
      x-wade-cli-ignore: true
  /api/v1/review-snapshots/{snapshotId}/files/{fileId}/contents:
    get:
      operationId: getReviewSnapshotFileContents
      parameters:
      - description: Review snapshot ID
        in: path
        name: snapshotId
        required: true
        type: string
      - description: Snapshot file ID
        in: path
        name: fileId
        required: true
        type: string
      - description: Comparison scope
        enum:
        - pull-request
        - working-tree
