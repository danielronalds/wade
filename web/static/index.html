<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WADE</title>
  <link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/vendor/xterm/xterm.js" defer></script>
  <script src="/static/vendor/xterm/addon-fit.js" defer></script>
  <script src="/static/app.js" type="module"></script>
</head>
<body>
  <main>
    <section id="home-view" aria-labelledby="home-title" hidden>
      <h1 id="home-title">WADE</h1>
      <nav aria-label="Recent projects">
        <ul id="recent-projects"></ul>
      </nav>
      <p id="empty-projects">No projects opened yet</p>
    </section>

    <section id="terminal-view" aria-label="Project terminal" hidden>
      <header>
        <nav aria-label="Window controls">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </nav>
        <p id="project-title">WADE</p>
        <button id="connection-status" type="button" aria-expanded="true" aria-live="polite" data-connected="false" data-open="true">
          <span aria-hidden="true"></span>
          <span>Disconnected</span>
        </button>
      </header>
      <section id="terminal" aria-label="Interactive shell"></section>
    </section>
  </main>
</body>
</html>
