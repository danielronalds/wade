name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Check release tooling
        run: mise run lint:release

      - name: Test release validation scripts
        run: bash .github/scripts/test-release.sh

      - name: Check formatting
        run: mise run lint:fmt

      - name: Check generated OpenAPI specification
        run: mise run lint:openapi

      - name: Build frontend
        run: npm --prefix web run build

      - name: Check generated frontend API client
        run: git diff --exit-code -- web/src/api/generated/wade.ts

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: gotestsum -- -race ./...

      - name: Build WADE
        run: go build ./cmd/wade
